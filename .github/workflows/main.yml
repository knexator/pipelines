# taken from https://nepo.dev/posts/ci-config-para-jams.html

name: build + deploy to itch
on:
  push:
    branches: ["main"]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  ITCHIO_USERNAME: knexator
  ITCHIO_GAME: pipelines-learning
  BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
  GODOT_VERSION: 4.7.1

jobs:
  web:
    name: Build and deploy to itch.io
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Setup
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Web Build
        run: |
          cd v3
          mkdir build
          godot --export-release --headless "Web" ./build/index.html
      - name: Itch.io Deploy
        run: |
          cd v3
          ls ./build
          butler push ./build $ITCHIO_USERNAME/$ITCHIO_GAME:html5
